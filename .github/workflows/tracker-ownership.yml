name: Tracker Ownership Gate

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  tracker-ownership:
    name: Tracker Ownership Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce root tracker ownership
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if ! grep -Fxq 'WORK_TRACKER.md' <<< "$changed_files"; then
            echo 'WORK_TRACKER.md is unchanged; ownership gate passes.'
            exit 0
          fi

          if [[ "$PR_AUTHOR" != 'Huyhuy225' ]]; then
            echo "Only Huyhuy225 may submit changes to WORK_TRACKER.md; PR author is $PR_AUTHOR." >&2
            exit 1
          fi

          echo 'WORK_TRACKER.md is changed by its authorized owner.'
