name: Tracker Ownership Gate

on:
  pull_request_target:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  pull-requests: read

jobs:
  tracker-ownership:
    name: Tracker Ownership Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce root tracker ownership
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # pull_request_target loads this workflow from the protected target
          # branch. It deliberately does not check out or execute pull-request
          # code; only the GitHub API is used to list changed paths.
          changed_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          if ! grep -Fxq 'WORK_TRACKER.md' <<< "$changed_files"; then
            echo 'WORK_TRACKER.md is unchanged; ownership gate passes.'
            exit 0
          fi

          if [[ "$PR_AUTHOR" != 'Huyhuy225' ]]; then
            echo "Only Huyhuy225 may submit changes to WORK_TRACKER.md; PR author is $PR_AUTHOR." >&2
            exit 1
          fi

          echo 'WORK_TRACKER.md is changed by its authorized owner.'
