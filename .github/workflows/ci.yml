name: Repository Hygiene CI

on:
  push:
    branches:
      - main
      - develop
      - '**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository Hygiene & Governance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for deterministic validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Validate YAML syntax
        run: |
          python -c "
          import os, sys, glob, yaml
          yaml_files = glob.glob('.github/**/*.yml', recursive=True) + glob.glob('.github/**/*.yaml', recursive=True)
          errors = 0
          for yf in yaml_files:
              try:
                  with open(yf, 'r', encoding='utf-8') as f:
                      yaml.safe_load(f)
                  print(f'OK: {yf}')
              except Exception as e:
                  print(f'ERROR parsing {yf}: {e}', file=sys.stderr)
                  errors += 1
          if errors > 0:
              sys.exit(1)
          print(f'Successfully validated {len(yaml_files)} YAML files.')
          "

      - name: Validate repository whitespace and text hygiene
        run: |
          python -c "
          import os, sys
          errors = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs:
                  dirs.remove('.git')
              for file in files:
                  path = os.path.join(root, file)
                  try:
                      with open(path, 'rb') as f:
                          content = f.read()
                      if not path.endswith(('.bin', '.elf', '.hex', '.png', '.jpg', '.ico')):
                          text = content.decode('utf-8')
                          if text and not text.endswith('\n'):
                              print(f'NOTICE: Missing final newline in {path}')
                  except UnicodeDecodeError:
                      continue
          print('Whitespace and text hygiene check completed.')
          "

      - name: Verify secrets hygiene
        run: |
          python -c "
          import os, sys, re
          forbidden_patterns = [
              re.compile(r'BEGIN (RSA |OPENSSH )?PRIVATE KEY'),
              re.compile(r'AKIA[0-9A-Z]{16}')
          ]
          errors = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs:
                  dirs.remove('.git')
              for file in files:
                  path = os.path.join(root, file)
                  # Skip scanning the CI workflow definition itself
                  if os.path.normpath(path) == os.path.normpath('.github/workflows/ci.yml'):
                      continue
                  if file.startswith('.env') and file != '.env.example':
                      print(f'ERROR: Committed environment file detected: {path}', file=sys.stderr)
                      errors += 1
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          for idx, line in enumerate(f, 1):
                              for pat in forbidden_patterns:
                                  if pat.search(line):
                                      print(f'ERROR: Potential secret pattern found in {path}:{idx}', file=sys.stderr)
                                      errors += 1
                  except Exception:
                      pass
          if errors > 0:
              sys.exit(1)
          print('Secrets hygiene check passed: No committed credentials or secret patterns detected.')
          "

      - name: Verify governance baseline files exist
        run: |
          python -c "
          import os, sys
          required_files = [
              'CONTRIBUTING.md',
              'DEVELOPMENT_GUIDE.md',
              '.github/CODEOWNERS',
              '.github/pull_request_template.md',
              '.env.example',
              '.gitignore'
          ]
          missing = [f for f in required_files if not os.path.isfile(f)]
          if missing:
              print(f'ERROR: Missing required governance files: {missing}', file=sys.stderr)
              sys.exit(1)
          print('All required governance baseline files are present.')
          "

      - name: Application Test Notice
        run: |
          echo "=============================================================================="
          echo "APPLICATION TEST STATUS NOTICE:"
          echo "This repository is currently in the initial architecture and governance baseline."
          echo "No application source modules (backend, firmware, gateway, frontend) exist yet."
          echo "Per repository governance, application test suites are intentionally not run,"
          echo "and no absent application tests are claimed to pass."
          echo "=============================================================================="
